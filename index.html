<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Modern Racing Manager</title>
    <meta name="description" content="Run a racing team from 2010 to 2026. Plays fully offline." />
    <!-- A personal project: keep it out of search engines wherever it is hosted. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />

    <!-- iPhone and iPad home screen -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Racing Mgr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Painted before the stylesheet arrives, so the app never flashes white. -->
    <style>html{color:#fff;background:#000}.rotate{display:none}</style>
    <script type="module" crossorigin src="./assets/index-D3SvawxY.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DY4jViKY.css">
  </head>
  <body>
    <div id="app"></div>
    <!-- Shown instead of the game whenever the screen is upright: the game plays in landscape. -->
    <div class="rotate" role="status">
      <svg class="rotate__icon" width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="24" y="8" width="24" height="42" rx="5" />
        <path d="M32 44h8" />
        <path d="M14 56c6 6 14 8 22 8h12" />
        <path d="m44 58 6 6-6 6" />
      </svg>
      <p class="rotate__title">Turn your phone sideways</p>
      <p class="rotate__text">Modern Racing Manager plays in landscape.</p>
      <button type="button" class="button button--secondary rotate__turn" data-turn-instead>Turn the game instead</button>
      <p class="rotate__text">For a phone with its rotation lock on: the game turns itself, to play held sideways.</p>
    </div>
    <noscript>Modern Racing Manager needs JavaScript to run.</noscript>
  </body>
</html>
